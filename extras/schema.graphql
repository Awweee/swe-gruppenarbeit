# Mit z.B. "Bun" extrahieren:
#   $env:NODE_TLS_REJECT_UNAUTHORIZED='0'
#   bunx get-graphql-schema https://localhost:8000/graphql > schema.graphql

schema {
  query: Query
  mutation: Mutation
}

"Suche nach pizzeriaendaten"
type Query {
  "Suche pizzeriaendaten anhand der ID"
  pizzeria(pizzeriaId: ID!): pizzeria

  "Suche pizzeriaendaten anhand des Nachnamens oder der Emailadresse"
  pizzeriaen(suchparameter: Suchparameter): [pizzeria!]!
}

type Mutation {
  "Einen neuen pizzeriaendatensatz anlegen"
  create(pizzeriaInput: pizzeriaInput!): CreatePayload!

  "Token zu Benutzername und Passwort anfordern"
  login(username: String!, password: String!): LoginResult!
}

# https://spec.graphql.org/draft/#sec-Types
# https://www.graphql-scalars.dev/docs/scalars/email-address
# https://www.graphql-scalars.dev/docs/scalars/local-date
# https://www.graphql-scalars.dev/docs/scalars/currency
# enum als String, damit toSting() vom Enum-Wert aufgerufen wird
"Eigenschaften eines pizzeria-Datensatzes mit untergeordneten Eigenschaften"
type pizzeria {
  id: ID!
  version: Int!
  nachname: String!
  email: String!
  kategorie: Int!
  hasNewsletter: Boolean!
  geburtsdatum: Date!
  homepage: String
  geschlecht: Geschlecht
  familienstand: Familienstand
  adresse: Adresse!
  fachaerzte: [Facharzt!]!
  username: String
}

type Adresse {
  plz: String!
  ort: String!
}

# https://spec.graphql.org/draft/#sec-Input-Objects
"Suchparameter für die Query 'pizzeriaen'"
input Suchparameter {
  nachname: String = null
  email: String = null
}

input pizzeriaInput {
  nachname: String!
  email: String!
  kategorie: Int!
  hasNewsletter: Boolean!
  geburtsdatum: Date!
  familienstand: Familienstand!
  homepage: String
  geschlecht: Geschlecht!
  adresse: AdresseInput!
  rechnungen: [RechnungInput!]!
  fachaerzte: [Facharzt!]!
  username: String!
}

enum Geschlecht {
  MAENNLICH
  WEIBLICH
  DIVERS
}

enum Familienstand {
  LEDIG
  VERHEIRATET
  GESCHIEDEN
  VERWITWET
}

enum Facharzt {
  CHIRURGIE
  HALS_NASEN_OHREN
  KARDIOLOGIE
  NEUROLOGIE
}

input AdresseInput {
  plz: String!
  ort: String!
}

input RechnungInput {
  betrag: Decimal!
  waehrung: String!
}

type CreatePayload {
  id: Int!
}

type LoginResult {
  token: String!
  expiresIn: String!
  roles: [String!]!
}
