info:
  name: Suche nachname, email, ... vom pizzeriaen mit ID 20
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($pizzeriaId: ID! = "20") {
        pizzeria(pizzeriaId: $pizzeriaId) {
          id
          version
          nachname
          email
          kategorie
          hasNewsletter
          geburtsdatum
          homepage
          geschlecht
          familienstand
          adresse {
            plz
            ort
          }
          fachaerzte
          username
        }
      }
    variables: |-
      {
        "pizzeriaId": "30"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.pizzeria
      operator: isJson
    - expression: res.body.data.pizzeria.version
      operator: gte
      value: "0"
    - expression: res.body.data.pizzeria.nachname
      operator: isString
    - expression: res.body.data.pizzeria.nachname
      operator: isNotEmpty
    - expression: res.body.data.pizzeria.email
      operator: isString
    - expression: res.body.data.pizzeria.email
      operator: isNotEmpty
    - expression: res.body.data.pizzeria.kategorie
      operator: gt
      value: "0"
    - expression: res.body.data.pizzeria.hasNewsletter
      operator: isBoolean
    - expression: res.body.data.pizzeria.geburtsdatum
      operator: isString
    - expression: res.body.data.pizzeria.homepage
      operator: isString
    - expression: res.body.data.pizzeria.geschlecht
      operator: isString
    - expression: res.body.data.pizzeria.familienstand
      operator: isString
    - expression: res.body.data.pizzeria.adresse
      operator: isJson
    - expression: res.body.data.pizzeria.fachaerzte
      operator: isArray
    - expression: res.body.data.pizzeria.username
      operator: isString
    - expression: res.body.data.pizzeria.username
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
